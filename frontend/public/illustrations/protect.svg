<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="A house and a car protected by a shield">
  <!-- soft backdrop -->
  <ellipse cx="280" cy="250" rx="250" ry="190" fill="#e3e9f3"/>
  <ellipse cx="280" cy="398" rx="236" ry="14" fill="#c5d2e6"/>
  <!-- house -->
  <g>
    <rect x="96" y="214" width="236" height="182" fill="#b8d4ff"/>
    <rect x="96" y="214" width="236" height="12" fill="#9cb1d2"/>
    <path d="M82 222 214 132 346 222Z" fill="#284067"/>
    <rect x="270" y="146" width="24" height="44" fill="#1b2f50"/>
    <!-- upper windows -->
    <g fill="#ffffff" stroke="#47679b" stroke-width="4">
      <rect x="122" y="244" width="48" height="44" rx="3"/>
      <rect x="122" y="318" width="48" height="44" rx="3"/>
    </g>
    <g stroke="#47679b" stroke-width="3"><path d="M146 244v44M122 266h48M146 318v44M122 340h48"/></g>
    <!-- porch + door -->
    <path d="M186 322h120l10 -14H176Z" fill="#284067"/>
    <rect x="196" y="322" width="44" height="74" fill="#1b2f50"/>
    <circle cx="232" cy="362" r="3" fill="#b8d4ff"/>
    <rect x="252" y="336" width="44" height="34" rx="3" fill="#ffffff" stroke="#47679b" stroke-width="4"/>
  </g>
  <!-- car -->
  <g>
    <path d="M330 372c0-16 10-26 26-28l22-30c4-6 10-8 17-8h58c8 0 14 3 18 9l20 29c14 2 24 12 24 28v14H330Z" fill="#2563c4"/>
    <path d="M384 318h30v26h-48Zm40 0h28c4 0 7 2 9 5l14 21h-51Z" fill="#d9e8ff"/>
    <rect x="330" y="372" width="185" height="14" rx="4" fill="#1d4f9e"/>
    <rect x="500" y="352" width="12" height="8" rx="2" fill="#fdf4e3"/>
    <g fill="#0f1f3a"><circle cx="366" cy="388" r="19"/><circle cx="478" cy="388" r="19"/></g>
    <g fill="#c5d2e6"><circle cx="366" cy="388" r="8"/><circle cx="478" cy="388" r="8"/></g>
  </g>
  <!-- shield -->
  <g>
    <path d="M280 60 196 92v74c0 64 36 108 84 124 48-16 84-60 84-124V92Z" fill="#0f1f3a"/>
    <path d="M280 80 214 105v61c0 52 28 89 66 103 38-14 66-51 66-103v-61Z" fill="#3b7ddd"/>
    <path d="M280 80v189c38-14 66-51 66-103v-61Z" fill="#2563c4"/>
    <!-- padlock -->
    <path d="M256 168v-14a24 24 0 0 1 48 0v14" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
    <rect x="242" y="164" width="76" height="62" rx="10" fill="#ffffff"/>
    <circle cx="280" cy="188" r="8" fill="#0f1f3a"/><path d="M276 192h8l3 18h-14Z" fill="#0f1f3a"/>
  </g>
  <!-- speech bubbles -->
  <g>
    <path d="M110 46h92a10 10 0 0 1 10 10v36a10 10 0 0 1-10 10h-56l-16 14v-14h-20a10 10 0 0 1-10-10V56a10 10 0 0 1 10-10Z" fill="#ffffff" stroke="#c5d2e6" stroke-width="2"/>
    <g stroke="#6b88b6" stroke-width="5" stroke-linecap="round"><path d="M122 66h68M122 82h46"/></g>
    <path d="M384 24h56a10 10 0 0 1 10 10v34a10 10 0 0 1-10 10h-18v14l-16-14h-22a10 10 0 0 1-10-10V34a10 10 0 0 1 10-10Z" fill="#15803d"/>
    <path d="m397 51 10 10 20-20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
